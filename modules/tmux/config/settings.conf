#### User tmux conf ####

unbind M-m
set -g prefix M-m # sets keybind
bind M-m send-prefix
unbind C-b # removes the default keybind

# set mouse on
set -g mouse on

# The handful of settings tmux-sensible used to apply, inlined so the
# plugin (and its submodule) can go
set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g focus-events on
set -g aggressive-resize on

# Truecolor: tmux-256color inside, and tell tmux the outer terminal (kitty)
# supports RGB
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-kitty:Tc,xterm-256color:Tc"

# unbind default horizontal/vertical split
unbind '"'
unbind %

# new binding for horizontal/vertical split
bind "|"  split-window -h -c '#{pane_current_path}'
bind '-'  split-window -v -c '#{pane_current_path}'
bind c    new-window -c '#{pane_current_path}'

bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# act like vim
setw -g mode-keys vi
set -g status-keys vi

# get rid of escape delay in vim
set -s escape-time 0

# Allow yank in copy-mode-vi
bind P paste-buffer
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle

# Join / Send / Break Panes
## Join window from '%%'      ->  <prefix> j
bind-key a command-prompt -p "join (attach) pane from:"  "join-pane -s '%%'"
## Send pane to '%%'          ->  <prefix> s
bind-key s command-prompt -p "send pane to:"    "join-pane -t '%%'"
## Send pane to new windows   ->  <prefix> b
bind-key b command-prompt "break-pane"
