source ~/.tmux/settings.conf

# Plugins are vendored as submodules in ~/.tmux/plugins; tpm loads them.
# nord-tmux is the status-bar theme; tpm is only here to load it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'arcticicestudio/nord-tmux'

# Machine-local overrides (untracked; may add @plugin lines). No-op if absent.
source -q ~/.tmux.conf.local

# Initialize TMUX plugin manager (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
