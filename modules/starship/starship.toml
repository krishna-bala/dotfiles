add_newline = false
# Move the directory to the second line
format = """
$container\
$username\
$hostname\
$python\
$git_branch\
$git_status\
$git_state\
$cmd_duration\
$line_break\
$directory\
$character\
"""

[username]
show_always = true
style_user = 'bold green'
format = '[$user@]($style)'

[container]
style = 'bold red'
symbol = ' '
format = '[\[$name\]]($style) [$symbol](bold blue) '

[aws]
symbol = "  "

[buf]
symbol = " "

[c]
symbol = " "

[conda]
symbol = " "
ignore_base = true

[crystal]
symbol = " "

[dart]
symbol = " "

[directory]
read_only = " 󰌾"
style = 'bold blue'

[docker_context]
symbol = " "

[elixir]
symbol = " "

