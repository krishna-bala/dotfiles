# agents - harness-agnostic instructions for coding agents, linked to each
# harness's user-level path, shared skills, and the Claude Code status line.
# Nothing here installs an agent; that is done per machine.
- defaults:
    link:
      relink: true
      backup: true
      create: true

- link:
    ~/.agents/AGENTS.md: AGENTS.md
    ~/.claude/CLAUDE.md: AGENTS.md
    ~/.codex/AGENTS.md: AGENTS.md
    ~/.claude/scripts/status-line.sh: status-line.sh

    # Link individual skills so other installed skills remain independent.
    ~/.agents/skills/vault: skills/vault
    ~/.claude/skills/vault: skills/vault
