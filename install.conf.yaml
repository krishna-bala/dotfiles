# Shell/terminal/dev half of the install; `./install` always runs this
# config, and additionally install-desktop.conf.yaml (the bspwm/X11 stack)
# unless invoked with --no-desktop.
#
# Links are relinked and existing regular paths are backed up so install
# converges without deleting a pre-existing file or directory.
- defaults:
    link:
      relink: true
      backup: true
      create: true

- link:
    ~/.bash_aliases: bash/bash_aliases
    ~/.bashrc: bash/bashrc
    ~/.profile: bash/profile
    ~/.inputrc: bash/inputrc
    ~/.bazel_completions.bash: bash/bazel_completions.bash
    ~/.gitconfig: git/gitconfig
    ~/.gitmessage: git/gitmessage
    ~/.git-prompt.sh: git/git-prompt.sh
    ~/.config/lazygit/config.yml: git/lazygit.yml
    ~/.config/starship.toml: starship/starship.toml
    ~/.tmux: tmux
    ~/.tmux.conf: tmux/tmux.conf
    ~/.config/kitty: kitty
    ~/.claude/CLAUDE.md: agents-config/user/AGENTS.md
    ~/.claude/scripts/status-line.sh: claude/user/scripts/status-line.sh

- shell:
    - [git submodule update --init --recursive, Installing/updating submodules]
